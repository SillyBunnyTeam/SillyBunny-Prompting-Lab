<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Prompting Lab fixture</title>
    <link rel="stylesheet" href="/style.css">
    <style>
        :root {
            --SmartThemeBlurTintColor: #202628;
            --SmartThemeBodyColor: #e4e9e7;
            --SmartThemeBorderColor: #596462;
            --mainFontSize: 1rem;
        }
        body { min-height: 100vh; margin: 0; background: #151a1b; color: #e4e9e7; font-family: sans-serif; }
        #extensionsMenu { min-height: 44px; padding: 8px; }
        #extensions-settings-button > .drawer-toggle { margin: 0 8px 8px; }
        #fixture-extension-shell { width: min(760px, 100%); max-height: calc(100vh - 100px); margin-left: auto; overflow-y: auto; }
        #extensions_settings2 { padding: 8px; }
        .text_pole { margin: 5px 0; }
        .menu_button { width: min-content; margin: 4px 0; }
    </style>
</head>
<body>
    <nav id="extensionsMenu"></nav>
    <section id="extensions-settings-button" class="drawer">
        <button class="drawer-toggle" type="button">Extensions</button>
        <div id="fixture-extension-shell" class="sb-shell-panel-scroller" hidden>
            <main id="extensions_settings2"></main>
        </div>
    </section>
    <script type="module">
        import { deactivate, init } from '/index.js';
        import { __setHostForTests } from '/src/host.js';
        import { __setStoreForTests, createMemoryStore, saveCase, saveRun, saveSuite } from '/src/storage.js';
        import { mountRuntimeUi } from '/src/ui/runtime.js';

        const shellPanel = document.getElementById('fixture-extension-shell');
        const shellCalls = [];
        let fallbackClicks = 0;

        function showExtensions() {
            shellPanel.hidden = false;
        }

        globalThis.SillyBunnyShell = {
            openTab(side, tab) {
                shellCalls.push([side, tab]);
                if (side === 'right' && tab === 'extensions') {
                    showExtensions();
                }
            },
        };

        document.querySelector('#extensions-settings-button > .drawer-toggle').addEventListener('click', () => {
            fallbackClicks += 1;
            shellPanel.hidden = !shellPanel.hidden;
        });
        document.addEventListener('click', (event) => {
            const toggle = event.target.closest('.inline-drawer-toggle');
            if (!(toggle instanceof HTMLElement)) {
                return;
            }
            const drawer = toggle.closest('.inline-drawer');
            const icon = drawer?.querySelector(':scope > .inline-drawer-header .inline-drawer-icon');
            const content = drawer?.querySelector(':scope > .inline-drawer-content');
            if (!(drawer instanceof HTMLElement) || !(icon instanceof HTMLElement) || !(content instanceof HTMLElement)) {
                return;
            }
            const expand = icon.classList.contains('down');
            icon.classList.toggle('down', !expand);
            icon.classList.toggle('up', expand);
            content.style.display = expand ? 'block' : 'none';
            drawer.dispatchEvent(new CustomEvent('inline-drawer-toggle', { bubbles: true }));
        });

        const eventTypes = {
            APP_READY: 'app-ready',
            CHAT_CHANGED: 'chat-changed',
            CHARACTER_EDITED: 'character-edited',
            SETTINGS_UPDATED: 'settings-updated',
        };
        const listeners = new Map();
        const eventSource = {
            on(type, handler) {
                const handlers = listeners.get(type) ?? new Set();
                handlers.add(handler);
                listeners.set(type, handlers);
            },
            makeLast(type, handler) {
                this.on(type, handler);
            },
            removeListener(type, handler) {
                listeners.get(type)?.delete(handler);
            },
            async emit(type, ...args) {
                for (const handler of [...(listeners.get(type) ?? [])]) {
                    await handler(...args);
                }
            },
        };

        // One manager per preset kind, the way the host registers them, so the
        // workshop can tell a Chat Completion preset from a template.
        const installedPresets = {
            openai: {
                Default: { prompts: [{ identifier: 'main', name: 'Main', role: 'system', content: 'Be helpful.' }], prompt_order: [{ character_id: 100001, order: [{ identifier: 'main', enabled: true }] }] },
                Deep: { prompts: [], prompt_order: [] },
            },
            textgenerationwebui: { Simple: { temp: 1 } },
            context: { Story: { name: 'Story', story_string: '{{description}}' } },
            instruct: { ChatML: { name: 'ChatML', input_sequence: '<|im_start|>' } },
            sysprompt: { Neutral: { name: 'Neutral', content: 'Write well.' } },
            reasoning: { DeepSeek: { name: 'DeepSeek', prefix: '<think>', suffix: '</think>' } },
        };
        const savedPresets = [];

        const originalFetch = globalThis.fetch.bind(globalThis);
        globalThis.fetch = async (resource, init) => {
            const url = String(resource);
            if (url.endsWith('/api/settings/get')) {
                return new Response(JSON.stringify({
                    openai_settings: Object.values(installedPresets.openai).map(p => JSON.stringify(p)),
                    openai_setting_names: Object.keys(installedPresets.openai),
                    textgenerationwebui_presets: Object.values(installedPresets.textgenerationwebui).map(p => JSON.stringify(p)),
                    textgenerationwebui_preset_names: Object.keys(installedPresets.textgenerationwebui),
                    context: Object.values(installedPresets.context),
                    instruct: Object.values(installedPresets.instruct),
                    sysprompt: Object.values(installedPresets.sysprompt),
                    reasoning: Object.values(installedPresets.reasoning),
                }), { headers: { 'Content-Type': 'application/json' } });
            }
            if (url.endsWith('/api/presets/save')) {
                const body = JSON.parse(String(init?.body ?? '{}'));
                savedPresets.push(body);
                return new Response(JSON.stringify({ name: body.name }), { headers: { 'Content-Type': 'application/json' } });
            }
            return originalFetch(resource, init);
        };

        const context = {
            characterId: 0,
            characters: [
                { avatar: 'tester.png', name: 'Tester', data: { extensions: {} } },
                { avatar: 'seraphina.png', name: 'Seraphina', data: { extensions: {} } },
            ],
            chat: [],
            chatMetadata: {},
            extensionSettings: {},
            eventSource,
            eventTypes,
            mainApi: 'openai',
            powerUserSettings: { personas: {} },
            getTokenCountAsync: async text => Math.ceil(String(text).length / 4),
            // A 1x1 transparent PNG, so the picker's images resolve without the
            // fixture server having to serve character thumbnails.
            getThumbnailUrl: (type, file) => `data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAADUlEQVR42mNk+M9QDwADhgGAWjR9awAAAABJRU5ErkJggg==#${type}/${file}`,
            saveSettingsDebounced: () => {},
            getRequestHeaders: () => ({ 'Content-Type': 'application/json' }),
            getPresetManager: (apiId = 'openai') => {
                const presets = installedPresets[apiId] ?? {};
                return {
                    getAllPresets: () => Object.keys(presets),
                    getSelectedPresetName: () => Object.keys(presets)[0] ?? '',
                    findPreset: name => (name in presets ? `value:${name}` : undefined),
                    selectPreset: async () => {},
                    getCompletionPresetByName: name => presets[name],
                };
            },
            getCharacterCardFields: () => ({}),
            writeExtensionField: async (index, key, value) => {
                context.characters[index].data ??= {};
                context.characters[index].data.extensions ??= {};
                context.characters[index].data.extensions[key] = value;
            },
            ConnectionManagerRequestService: {
                isProfileSupported: () => true,
                sendRequest: async (profileId) => `reply from ${profileId}`,
            },
        };
        context.powerUserSettings.personas = { 'me.png': 'Me' };
        context.extensionSettings.connectionManager = {
            profiles: [
                { id: 'p1', name: 'Local', mode: 'tc', model: 'llama' },
                { id: 'p2', name: 'Claude', mode: 'cc', model: 'claude' },
            ],
            selectedProfile: 'p1',
        };
        context.extensionSettings.promptTags = {
            activeProfile: 'Tagged',
            activeProfileId: 'tag-1',
            profiles: { Tagged: { id: 'tag-1', rules: {} } },
        };
        globalThis.SillyTavern = { getContext: () => context };

        __setStoreForTests(createMemoryStore());
        __setHostForTests({ ok: true, warnings: [], openai: {}, tokenCounts: {}, utils: {} });

        globalThis.fixtureDeactivate = deactivate;
        globalThis.fixtureEmit = (...args) => eventSource.emit(...args);
        globalThis.fixtureGetRouting = () => ({
            shellCalls: structuredClone(shellCalls),
            fallbackClicks,
        });
        globalThis.fixtureCloseShell = () => { shellPanel.hidden = true; };
        globalThis.fixtureGetSavedPresets = () => structuredClone(savedPresets);
        globalThis.fixtureRemoveShellApi = () => { delete globalThis.SillyBunnyShell; };
        // mountRuntimeUi returns the already-mounted controller, so the test can
        // drive the same availability path the extension uses after loadHost().
        globalThis.fixtureSetAvailability = value => mountRuntimeUi().setAvailability(value);
        globalThis.fixtureSeedUnchecked = async () => {
            const testCase = await saveCase({
                id: 'fixture-unchecked-case',
                name: 'Unchecked fixture case',
                pins: { characterAvatar: 'tester.png' },
            });
            await saveSuite({
                id: 'fixture-unchecked-suite',
                name: 'Unchecked fixture suite',
                caseIds: [testCase.id],
                baselines: {},
            });
            await saveRun({
                id: 'fixture-unchecked-run',
                suiteId: 'fixture-unchecked-suite',
                caseId: testCase.id,
                caseName: testCase.name,
                status: 'pass',
                assertionResults: [{
                    index: 0,
                    type: 'wi-activated',
                    pass: null,
                    message: 'No lorebook activity was recorded for this run.',
                }],
            });
        };

        init();
        await eventSource.emit(eventTypes.APP_READY);
        globalThis.__ready = true;
    </script>
</body>
</html>
